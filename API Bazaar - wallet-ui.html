<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet UI Demo - API Bazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">

    <h1 class="text-3xl font-bold mb-8 text-center">Wallet Connection UI States (For Backend Reference)</h1>

    <div class="bg-white p-8 rounded-lg shadow-md mb-10 max-w-4xl mx-auto">
        <h2 class="text-xl font-bold mb-6 border-b pb-2">1. Button States (Top Navigation)</h2>
        <div class="flex flex-col md:flex-row gap-8 items-center justify-center">
            
            <div class="text-center">
                <p class="text-sm text-gray-500 mb-2">State 1: Not Connected</p>
                <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full shadow">
                    Connect Wallet
                </button>
            </div>

            <div class="text-center">
                <p class="text-sm text-gray-500 mb-2">State 2: Connecting...</p>
                <button class="bg-gray-400 text-white font-bold py-2 px-6 rounded-full cursor-wait flex items-center justify-center gap-2">
                    <span>⏳</span> Processing...
                </button>
            </div>

            <div class="text-center">
                <p class="text-sm text-gray-500 mb-2">State 3: Connected</p>
                <button class="bg-green-100 border border-green-500 text-green-700 hover:bg-green-200 font-bold py-2 px-6 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span> 
                    0x1A2B...3C4D
                </button>
            </div>

        </div>
    </div>

    <div class="bg-white p-8 rounded-lg shadow-md max-w-4xl mx-auto relative h-96 flex items-center justify-center border-2 border-dashed border-gray-300">
        <div class="absolute inset-0 bg-gray-900 bg-opacity-20 rounded-lg"></div>

        <div class="bg-white rounded-xl shadow-2xl w-96 z-10 overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800">Connect your wallet</h3>
                <button class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
            </div>
            
            <div class="p-6 flex flex-col gap-4">
                <button class="flex items-center justify-between p-4 border rounded-lg hover:bg-blue-50 hover:border-blue-300 transition">
                    <span class="font-bold text-gray-700">MetaMask</span>
                    <span class="text-2xl">🦊</span> </button>

                <button class="flex items-center justify-between p-4 border rounded-lg hover:bg-blue-50 hover:border-blue-300 transition">
                    <span class="font-bold text-gray-700">WalletConnect</span>
                    <span class="text-2xl">🔗</span>
                </button>
            </div>
            
            <div class="p-4 bg-gray-50 text-center text-xs text-gray-500">
                By connecting a wallet, you agree to API Bazaar's Terms of Service.
            </div>
        </div>
    </div>

</body>
</html>
