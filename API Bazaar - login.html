<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - API Bazaar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-10 rounded-xl shadow-2xl max-w-2xl w-full text-center">
        <h1 class="text-4xl font-extrabold text-blue-600 mb-4">API Bazaar</h1>
        <p class="text-gray-500 mb-10 text-lg">The Decentralised Marketplace for Niche APIs.</p>
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Choose your role to continue</h2>

        <div class="flex flex-col md:flex-row gap-6 justify-center">
            
            <a href="API Bazaar - buyer page.html" class="flex-1 border-2 border-blue-200 hover:border-blue-600 hover:bg-blue-50 p-8 rounded-lg transition group cursor-pointer text-decoration-none">
                <div class="text-5xl mb-4">🛒</div>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-blue-600">I am a Buyer</h3>
                <p class="text-gray-500 text-sm mt-2">Explore, purchase, and use niche APIs securely.</p>
            </a>

            <a href="API Bazaar - provider page.html" class="flex-1 border-2 border-green-200 hover:border-green-600 hover:bg-green-50 p-8 rounded-lg transition group cursor-pointer text-decoration-none">
                <div class="text-5xl mb-4">💻</div>
                <h3 class="text-xl font-bold text-gray-800 group-hover:text-green-600">I am a Provider</h3>
                <p class="text-gray-500 text-sm mt-2">Upload your API, set pricing, and earn on-chain.</p>
            </a>

        </div>
    </div>

</body>
</html>
